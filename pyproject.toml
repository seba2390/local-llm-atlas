[project]
name = "local-llm-atlas"
version = "0.1.0"
description = "A cited data catalogue of open-weight LLMs: benchmark scores, architecture, memory footprint, throughput and offload techniques for consumer hardware."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.21",
    "pyarrow>=26.0.0",
]

[project.scripts]
atlas = "atlas.cli:main"

[dependency-groups]
dev = ["pytest>=8"]
plot = [
    "matplotlib>=3.11.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
default-groups = ["dev", "plot"]
